name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push supersedes the previous run on the same branch. Without this, a
# series of quick pushes queues runs that are already obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The rate limiter's guarantee lives inside a Lua script the server
    # executes, so its tests run against a real Redis. A mocked client would
    # assert that the right string was sent and prove nothing about atomicity,
    # which is the only property that matters there.
    #
    # The same holds for DynamoDB: no oversell, one payment claim, atomic
    # settlement are all condition expressions and transactions the store
    # evaluates. single-table.integration.spec.ts runs them against a real engine.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      dynamodb:
        image: amazon/dynamodb-local:2.5.4
        ports:
          - 8000:8000

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DYNAMODB_TEST_ENDPOINT: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails if package.json and the lockfile disagree, so a
      # dependency can never be added without its lockfile entry being reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # The 80% threshold lives in jest.config.ts, so this step fails on its own
      # if coverage regresses. No separate gate to keep in sync.
      - name: Test with coverage
        run: pnpm test:cov

      # The image is built in the container job, but the artifact's contents are
      # checked here where the toolchain already is.
      - name: Build artifact is clean
        run: |
          pnpm build
          ./scripts/check-build-artifact.sh

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo ''
            echo '| Metric | Covered | Total | % |'
            echo '| --- | ---: | ---: | ---: |'
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              for (const k of ['statements','branches','functions','lines'])
                console.log(\`| \${k} | \${s[k].covered} | \${s[k].total} | \${s[k].pct}% |\`);
            "
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Production tree only. A vulnerability in a build tool does not ship to
      # users, and failing on it would train everyone to ignore this job.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  container:
    name: Container builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: adh-shop-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Readiness reads the table, so the container gets one to read: DynamoDB
      # Local, with the key schema of the real table.
      - name: Start DynamoDB Local with the application's table
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker network create smoke
          docker run -d --name dynamodb --network smoke -p 8000:8000 amazon/dynamodb-local:2.5.4

          for attempt in $(seq 1 20); do
            aws dynamodb list-tables --endpoint-url http://127.0.0.1:8000 > /dev/null 2>&1 && break
            sleep 1
          done

          # Table names need at least three characters.
          aws dynamodb create-table --endpoint-url http://127.0.0.1:8000 \
            --table-name adh-shop-ci \
            --billing-mode PAY_PER_REQUEST \
            --attribute-definitions \
              AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
              AttributeName=GSI1PK,AttributeType=S AttributeName=GSI1SK,AttributeType=S \
            --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
            --global-secondary-indexes \
              'IndexName=GSI1,KeySchema=[{AttributeName=GSI1PK,KeyType=HASH},{AttributeName=GSI1SK,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
            > /dev/null

      # A green compile proves nothing about whether the artifact runs: with no
      # entry point, `pnpm build` still exits 0. This step is the real gate.
      - name: Start the container and probe it
        run: |
          docker run -d --name api --network smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e AWS_REGION=us-east-1 \
            -e DYNAMODB_TABLE_NAME=adh-shop-ci \
            -e DYNAMODB_ENDPOINT=http://dynamodb:8000 \
            -e PAYMENT_API_URL=https://gateway.invalid/v1 \
            -e PAYMENT_PUBLIC_KEY=ci \
            -e PAYMENT_PRIVATE_KEY=ci \
            -e PAYMENT_INTEGRITY_SECRET=ci \
            -e PAYMENT_EVENTS_SECRET=ci \
            -e CDN_DOMAIN=cdn.invalid \
            -e CDN_KEY_PAIR_ID=ci \
            -e CDN_PRIVATE_KEY_BASE64=Y2k= \
            -e CORS_ALLOWED_ORIGINS=https://storefront.test \
            adh-shop-api:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "Container answered /health after ${attempt} attempt(s)"
              # Ready means the table answered, not merely that the process is up.
              curl -fsS http://127.0.0.1:3000/ready
              # The README links the live API docs; losing them breaks a deliverable.
              curl -fsS http://127.0.0.1:3000/api/docs-json > openapi.json

              # The storefront generates its API client from this document, and
              # names its hooks after each operationId. Every route must declare
              # its own, in camelCase and unique; Nest's default leaks class names.
              node -e "
                const doc = require('./openapi.json');
                const ids = Object.values(doc.paths).flatMap((ops) => Object.values(ops).map((op) => op.operationId));
                const bad = ids.filter((id) => !/^[a-z][A-Za-z]+$/.test(id ?? ''));
                const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
                if (bad.length || dupes.length) {
                  console.error('operationIds must be explicit, camelCase and unique:', { bad, dupes });
                  process.exit(1);
                }
                console.log('operationIds:', ids.join(', '));
              "

              # The storefront is on another origin: a browser sends a preflight
              # before every write, and refuses the call without this answer.
              preflight=$(curl -fsS -o /dev/null -D - -X OPTIONS \
                -H 'Origin: https://storefront.test' \
                -H 'Access-Control-Request-Method: POST' \
                -H 'Access-Control-Request-Headers: content-type,idempotency-key' \
                http://127.0.0.1:3000/api/v1/transactions)
              echo "$preflight" | grep -qi '^access-control-allow-origin: https://storefront.test' \
                || { echo "CORS preflight not answered for the storefront origin"; echo "$preflight"; exit 1; }
              exit 0
            fi
            sleep 2
          done

          echo "Container never became healthy. Logs:"
          docker logs api
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs api || true
